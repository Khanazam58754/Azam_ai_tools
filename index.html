else if(id==4)b.innerHTML=`<textarea id="t4" placeholder="Type text"></textarea><button id="b4">🔊 Speak</button>`;

function attachEvents(){
let f1=document.getElementById('f1');if(f1)f1.onchange=async e=>{document.getElementById('r1').innerText='Reading...';let {data:{text}}=await Tesseract.recognize(e.target.files[0],'eng');document.getElementById('r1').innerText=text;};
let f2=document.getElementById('f2');if(f2)f2.onchange=e=>{let img=new Image();img.onload=()=>{let c=document.getElementById('c2');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);let d=ctx.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){if(d.data[i]>230&&d.data[i+1]>230&&d.data[i+2]>230)d.data[i+3]=0;}ctx.putImageData(d,0,0);};img.src=URL.createObjectURL(e.target.files[0]);};
let dl2=document.getElementById('dl2');if(dl2)dl2.onclick=()=>{let c=document.getElementById('c2');let a=document.createElement('a');a.download='azam-bg-removed.png';a.href=c.toDataURL();a.click();};
let qbtn=document.getElementById('qbtn');if(qbtn)qbtn.onclick=()=>{let q=document.getElementById('qin').value;let chat=document.getElementById('chat');chat.innerHTML+=`<div><b>You:</b> ${q}</div><div><b>Azam AI:</b> You said "${q}" - I am working offline, built by Azam Aligarh!</div>`;};
let b4=document.getElementById('b4');if(b4)b4.onclick=()=>{speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('t4').value));};
let b5=document.getElementById('b5');if(b5)b5.onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new R();r.onresult=e=>{document.getElementById('r5').innerText=e.results[0][0].transcript;};r.start();};
let b6=document.getElementById('b6');if(b6)b6.onclick=()=>{let p=encodeURIComponent(document.getElementById('p6').value);document.getElementById('i6').src=`https://image.pollinations.ai/prompt/${p}?width=512&height=512&seed=${Date.now()}`;};
let b7=document.getElementById('b7');if(b7)b7.onclick=()=>{let c=document.getElementById('can7');let ctx=c.getContext('2d');ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,400,200);ctx.fillStyle=document.getElementById('c7').value;ctx.font='bold 44px Arial';ctx.textAlign='center';ctx.fillText(document.getElementById('t7').value||'AZAM',200,120);};
let b8=document.getElementById('b8');if(b8)b8.onclick=()=>{document.getElementById('r8').innerHTML=`<h3>${document.getElementById('n8').value}</h3><b>Skills:</b> ${document.getElementById('s8').value}<br>${document.getElementById('e8').value}`;};
let f11=document.getElementById('f11');if(f11)f11.onchange=e=>{let img=new Image();img.onload=()=>{let c=document.getElementById('c11');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);};img.src=URL.createObjectURL(e.target.files[0]);};
let dl11=document.getElementById('dl11');if(dl11)dl11.onclick=()=>{let c=document.getElementById('c11');let q=parseFloat(document.getElementById('q11').value);let a=document.createElement('a');a.download='compressed.jpg';a.href=c.toDataURL('image/jpeg',q);a.click();};
let b12=document.getElementById('b12');if(b12)b12.onclick=()=>{document.getElementById('i12').src=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(document.getElementById('t12').value)}`;};
let b13=document.getElementById('b13');if(b13)b13.onclick=()=>{let t=document.getElementById('t13').value;document.getElementById('r13').innerText=`#${t} #${t}love #${t}india #viral #trending #azamtools`.replace(/ /g,'');};
let b14=document.getElementById('b14');if(b14)b14.onclick=()=>{let u=document.getElementById('u14').value;let id=u.split('v=')[1]?.split('&')[0]||u.split('/').pop();document.getElementById('r14').innerHTML=`<img src="https://img.youtube.com/vi/${id}/maxresdefault.jpg" style="width:100%"><br><a href="https://img.youtube.com/vi/${id}/maxresdefault.jpg" target="_blank">Download HD</a>`;};
let b15=document.getElementById('b15');if(b15)b15.onclick=()=>{let len=document.getElementById('l15').value;let ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#';let p='';for(let i=0;i<len;i++)p+=ch[Math.floor(Math.random()*ch.length)];document.getElementById('r15').innerText=p;};

let c19=document.getElementById('c19');if(c19)c19.oninput=e=>{document.getElementById('r19').innerText=e.target.value;document.getElementById('r19').style.background=e.target.value;};
let f20=document.getElementById('f20');if(f20)f20.onchange=e=>{let img=new Image();img.onload=()=>{let c=document.getElementById('c20');c.width=parseInt(document.getElementById('w20').value);c.height=parseInt(document.getElementById('h20').value);c.getContext('2d').drawImage(img,0,0,c.width,c.height);};img.src=URL.createObjectURL(e.target.files[0]);};

let b22=document.getElementById('b22');if(b22)b22.onclick=async()=>{let res=await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(document.getElementById('u22').value)}`);document.getElementById('r22').innerText=await res.text();};

let b25=document.getElementById('b25');if(b25)b25.onclick=()=>{let t=document.getElementById('t25').value;document.getElementById('r25').innerText=t.split(' ').join(', ')+', viral, trending, 2026';};
let b26=document.getElementById('b26');if(b26)b26.onclick=()=>{let n=document.getElementById('n26').value;let p=document.getElementById('p26').value;document.getElementById('r26').innerText=`👋 Hi, I'm ${n} | ${p} | Aligarh | Azam AI Tools 🚀`;};
let b27=document.getElementById('b27');if(b27)b27.onclick=()=>{let t=document.getElementById('t27').value;document.getElementById('r27').innerText=`✨ ${t} vibes 🔥\nLiving my best ${t} life 💯\n#${t.replace(/ /g,'')}`;};
let b28=document.getElementById('b28');if(b28)b28.onclick=()=>{let t=document.getElementById('t28').value;document.getElementById('r28').innerText=t.split(/\s+/).map(w=>'#'+w).join(' ');};
}
